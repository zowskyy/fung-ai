name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      exe-path: ${{ steps.build.outputs.exe-path }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-qt
        pip install PySide6
        pip install pyinstaller

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      shell: python
      run: |
        import subprocess
        result = subprocess.run([
            "python", "-m", "pytest", "tests/",
            "--ignore=tests/test_30_providers_hello_world.py",
            "--ignore=tests/test_e2e_post_install.py",
            "--ignore=tests/test_ai_server.py",
            "--ignore=tests/test_kotlin_runner_stress.py",
            "--ignore=tests/test_cpp_runner_stress.py",
            "--ignore=tests/test_java_runner_stress.py",
            "--ignore=tests/test_rust_runner_stress.py",
            "--ignore=tests/test_js_runner_stress.py",
            "--ignore=tests/test_provider_live.py",
            "-v", "--tb=short"
        ])
        exit(result.returncode)

    - name: Build executable
      id: build
      run: |
        python build_exe.py
        echo "exe-path=dist/Creator/Creator.exe" >> $env:GITHUB_OUTPUT

    - name: Create Windows release package
      run: |
        cd dist
        Compress-Archive -Path "Creator/*" -DestinationPath "Creator-Windows.zip" -Force
        cd ..
        # Also create a portable folder copy for easy access
        Copy-Item -Path "dist/Creator" -Destination "dist/Creator-Portable" -Recurse -Force

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: creator-windows
        path: |
          dist/Creator-Windows.zip
          dist/Creator.exe
        retention-days: 30

  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-qt
        sudo apt-get update && sudo apt-get install -y python3-pyqt5.qtwebengine
        pip install PySide6
        pip install pyinstaller

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest tests/ \
          --ignore=tests/test_30_providers_hello_world.py \
          --ignore=tests/test_e2e_post_install.py \
          --ignore=tests/test_ai_server.py \
          --ignore=tests/test_kotlin_runner_stress.py \
          --ignore=tests/test_cpp_runner_stress.py \
          --ignore=tests/test_java_runner_stress.py \
          --ignore=tests/test_rust_runner_stress.py \
          --ignore=tests/test_js_runner_stress.py \
          --ignore=tests/test_provider_live.py \
          -v --tb=short

    - name: Build executable
      run: |
        python build_exe.py

    - name: Create Linux release package
      run: |
        cd dist
        tar -czf Creator-Linux.tar.gz Creator/

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: creator-linux
        path: dist/Creator-Linux.tar.gz
        retention-days: 30

  create-release:
    needs: [build-windows, build-ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: creator-windows
        path: ./release/

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: creator-linux
        path: ./release/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Creator ${{ github.ref_name }}
        body: |
          ## Creator ${{ github.ref_name }}
          
          A free, no-credit-card coding tool for kids. One prompt field → AI generates runnable code → runs it → validates output.
          
          ### Features
          - **Playground**: Single prompt field, instant generation + execution
          - **Local-first**: Ollama (auto-install) → GGUF fallback → Cloud providers
          - **8 verified providers**: Ollama, Groq, Cerebras, Gemini, Mistral, DeepInfra, OpenRouter, HuggingFace
          - **Zero bloat**: Models download on-demand to ~/.creator/
          - **Kid-safe**: No auto-repair, flags failures for manual review
          
          ### Downloads
          - **Windows**: `Creator-Windows.zip` (portable, no installer needed)
          - **Linux**: `Creator-Linux.tar.gz` (PyInstaller onedir bundle)
          
          ### Quick Start
          1. Download and extract
          2. Run `Creator.exe` (Windows) or `./Creator` (Linux)
          3. Type what you want to build in the Playground
          4. Press Go
        files: |
          release/Creator-Windows.zip
          release/Creator-Linux.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}